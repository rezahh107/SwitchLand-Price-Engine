name: WP All Import public fixture boundary
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject public commercial binaries and identity drift
        run: python3 tests/wp-all-import-ci-lab/check-public-boundary.py
      - name: Verify CLI syntax and absent private input fails closed
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/wp-all-import-ci-lab/verify-package-fixtures.php
          manifest="tests/fixtures/wp-all-import-packages/manifest.json"
          if php tests/wp-all-import-ci-lab/verify-package-fixtures.php "$manifest" "$RUNNER_TEMP/not-provisioned" > "$RUNNER_TEMP/fixture-failure.log" 2>&1; then
            echo "Missing private fixture was incorrectly accepted" >&2
            exit 1
          fi
          grep -q 'WPAI_PACKAGE_FIXTURE_FAILURE:' "$RUNNER_TEMP/fixture-failure.log"
      - name: Falsify the guard with a synthetic tracked ZIP
        shell: bash
        run: |
          set -euo pipefail
          synthetic="tests/fixtures/wp-all-import-packages/_synthetic-public-binary.zip"
          printf 'synthetic fixture - never real vendor package' > "$synthetic"
          git add -f "$synthetic"
          if python3 tests/wp-all-import-ci-lab/check-public-boundary.py > "$RUNNER_TEMP/guard-negative.log" 2>&1; then
            echo "Public ZIP guard incorrectly accepted injected archive" >&2
            exit 1
          fi
          grep -q 'PUBLIC_FIXTURE_BOUNDARY_FAIL' "$RUNNER_TEMP/guard-negative.log"
          git reset -q HEAD -- "$synthetic"
          rm -f "$synthetic"
          python3 tests/wp-all-import-ci-lab/check-public-boundary.py
