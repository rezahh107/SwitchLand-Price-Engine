name: Temporary verify exact WP All Import fixtures

on:
  push:
    branches:
      - lab/wpai-binary-fixture-admission
    paths:
      - .github/workflows/_tmp-admit-wpai-binaries.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify committed exact fixtures
        shell: bash
        run: |
          set -euo pipefail
          root="tests/fixtures/wp-all-import-packages"
          verifier="tests/wp-all-import-ci-lab/verify-package-fixtures.php"

          stat -c '%n %s' "$root/wp-all-import-pro.zip" "$root/wpai-woocommerce-add-on_4.0.6.zip"
          sha256sum "$root/wp-all-import-pro.zip" "$root/wpai-woocommerce-add-on_4.0.6.zip"
          php "$verifier" "$root"

      - name: Falsification controls
        shell: bash
        run: |
          set -euo pipefail
          root="tests/fixtures/wp-all-import-packages"
          verifier="$GITHUB_WORKSPACE/tests/wp-all-import-ci-lab/verify-package-fixtures.php"

          expect_fail() {
            local label="$1"
            local dir="$2"
            set +e
            output="$(php "$verifier" "$dir" 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "NEGATIVE_FAIL $label: verifier unexpectedly passed" >&2
              exit 1
            fi
            echo "NEGATIVE_PASS $label :: $(printf '%s' "$output" | head -n1)"
          }

          wrong_sha="$RUNNER_TEMP/wpai-wrong-sha"
          cp -a "$root" "$wrong_sha"
          php -r '
            $p=$argv[1];
            $d=json_decode(file_get_contents($p), true, 512, JSON_THROW_ON_ERROR);
            $d["packages"][0]["sha256"]=str_repeat("0",64);
            file_put_contents($p, json_encode($d, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");
          ' "$wrong_sha/manifest.json"
          expect_fail wrong_sha "$wrong_sha"

          missing="$RUNNER_TEMP/wpai-missing"
          cp -a "$root" "$missing"
          rm "$missing/wp-all-import-pro.zip"
          expect_fail missing_package "$missing"

          unexpected="$RUNNER_TEMP/wpai-unexpected"
          cp -a "$root" "$unexpected"
          cp "$unexpected/wp-all-import-pro.zip" "$unexpected/unexpected.zip"
          expect_fail unexpected_package "$unexpected"
